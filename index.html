<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SketchText · Draw to ASCII</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">#</div>
      <div class="brand-copy">
        <h1>SketchText</h1>
        <p>Draw it. Turn it into text.</p>
      </div>
      <button id="clearButton" class="button button-quiet" type="button">Clear canvas</button>
    </header>

    <section class="workspace" aria-label="Drawing workspace">
      <div class="drawing-column">
        <div class="toolbar" role="toolbar" aria-label="Drawing tools">
          <button class="tool-button active" data-tool="select" type="button" title="Select and move" aria-label="Select and move">↖ <span>Select</span></button>
          <button class="tool-button" data-tool="freehand" type="button" title="Draw X marks on the grid" aria-label="Draw X marks on the grid">✎ <span>Draw</span></button>
          <button class="tool-button" data-tool="rect" type="button" title="Rectangle" aria-label="Rectangle">▱ <span>Rectangle</span></button>
          <button class="tool-button" data-tool="line" type="button" title="Line" aria-label="Line">╱ <span>Line</span></button>
          <button class="tool-button" data-tool="arrow" type="button" title="Arrow" aria-label="Arrow">➜ <span>Arrow</span></button>
          <button class="tool-button" data-tool="text" type="button" title="Text label" aria-label="Text label">T <span>Text</span></button>
          <button class="tool-button" data-tool="eraser" type="button" title="Erase objects by clicking or dragging over them" aria-label="Eraser">⌫ <span>Eraser</span></button>
          <label class="color-control" title="Drawing color">
            <span>Ink</span><input id="inkColor" type="color" value="#252833" aria-label="Drawing color">
          </label>
        </div>
        <div class="canvas-frame" aria-label="Drawing workspace viewport">
          <div class="canvas-world">
            <canvas id="drawingCanvas" width="4000" height="2500" aria-label="Drawing canvas"></canvas>
            <textarea id="textEditor" class="canvas-text-editor" aria-label="Edit canvas text" rows="1" hidden></textarea>
          </div>
        </div>
        <div class="canvas-footer">
          <button id="undoButton" class="text-button" type="button" disabled>Undo last action</button>
        </div>
      </div>

      <div class="workspace-divider" role="separator" aria-orientation="vertical" aria-label="Resize drawing and output panes" tabindex="0"></div>

      <aside class="output-column" aria-label="ASCII output">
        <div class="section-heading">
          <div>
            <p class="eyebrow">TEXT OUTPUT</p>
            <h2>ASCII drawing</h2>
          </div>
          <span class="status-dot" aria-hidden="true"></span>
        </div>
        <p class="section-description">Your sketch becomes live text as you draw. Copy the drawing alone or include your optional descriptor.</p>
        <p class="field-label">Live text preview <span class="optional">generated text · scroll vertically</span></p>
        <div class="ascii-viewport" aria-label="ASCII preview viewport">
          <pre id="asciiPreview" class="ascii-preview is-empty" aria-label="Generated ASCII text">Your ASCII drawing will appear here…</pre>
        </div>
        <label class="field-label" for="descriptor">Descriptor <span class="optional">optional</span></label>
        <textarea id="descriptor" class="descriptor" rows="3" placeholder="Explain anything the drawing alone doesn't show…"></textarea>
        <div class="output-actions">
          <button id="copyButton" class="button button-primary" type="button">Copy Drawing + Descriptor</button>
          <button id="copyAsciiButton" class="button button-secondary" type="button">Copy ASCII</button>
          <button id="copyMarkdownButton" class="button button-secondary" type="button">Copy Markdown</button>
        </div>
        <p id="statusMessage" class="status-message" role="status" aria-live="polite">Nothing copied yet.</p>
      </aside>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
